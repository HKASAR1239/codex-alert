name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
      - run: bash -n install.command
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compile the macOS flash
        run: swiftc -O -framework AppKit native/codex-flash.swift -o "$RUNNER_TEMP/codex-flash"
